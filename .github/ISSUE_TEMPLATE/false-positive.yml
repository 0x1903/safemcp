name: False positive
description: safemcp flagged something that is actually fine
labels: [false-positive]
body:
  - type: input
    attributes: { label: Rule ID, placeholder: e.g. TP003 or MCP002 }
    validations: { required: true }
  - type: textarea
    attributes:
      label: What was flagged
      description: Paste the finding and the relevant config or tool description. **Remove any secrets first.**
      render: text
    validations: { required: true }
  - type: textarea
    attributes: { label: Why it's legitimate }
